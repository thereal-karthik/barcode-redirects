function parse(buf,fname){var wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets.Plate||wb.Sheets[wb.SheetNames[0]];
var g=function(r,c){var x=ws[XLSX.utils.encode_cell({r:r-1,c:c-1})];return x?x.v:undefined};
var re=[],r=2;while(g(r,1)&&g(r,1)!=='Target Concentrations'){var a=String(g(r,1)).replace(' (M)',''),b=g(r,2);re.push({label:a,name:b!=null&&b!==''?String(b):a,unit:g(r,4)||'M'});r++}
var bl=[];for(var c=1;c<80;c++)if(typeof g(7,c)==='string')bl.push(c);
if(!re.length||bl.length!==re.length)throw new Error('Could not find the stock table and target tables. Expected a Plate tab laid out like the examples.');
var conc={},neg=[];ROWS.forEach(function(L,i){for(var j=0;j<12;j++){conc[L+(j+1)]=bl.map(function(b){var v=g(8+i,b+1+j);if(v===undefined)throw new Error('Missing value at row '+(8+i)+'. If the sheet has formulas, open it in Excel, save, and re-upload.');return Math.round(Number(v)*1e6)/1e6})}});
for(var rr=8;rr<=26;rr++)for(c=1;c<=70;c++){var x=g(rr,c);if(typeof x==='number'&&x<0)neg.push(XLSX.utils.encode_cell({r:rr-1,c:c-1}))}
var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);
return{neg:neg,t:{id:'CT-'+Array.prototype.map.call(crypto.getRandomValues(new Uint8Array(6)),function(x){return('0'+x.toString(16)).slice(-2)}).join('').toUpperCase(),name:fname.replace(/\.xlsx?$/i,'').replace(/^_+/,'').replace(/_/g,' '),date:new Date().toISOString().slice(0,10),reagents:re,blocks:bl,conc:conc,src:btoa(s)}}}
async function register(t,pw){
for(var tries=0;tries<3;tries++){
  var res=await fetch('/api/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw,slug:t.slug,targetUrl:target(t),table:t})});
  var j={};try{j=await res.json()}catch(e){}
  if(res.ok&&j.ok===true)return{ok:true};
  if(j&&j.error==='slug_taken'){t.slug=nslug();continue}
  return{ok:false,error:j&&j.error&&j.error!=='slug_taken'?String(j.error):(res.status===401||res.status===403?'Wrong password.':'Registration failed ('+res.status+').')}}
return{ok:false,error:'Could not find a free slug. Try again.'}}

var nm=E('input',{type:'text',value:t.name,'aria-label':'Table name'}),pw=E('input',{type:'password',autocomplete:'current-password','aria-label':'Password'}),badge=E('div',{class:'badge',role:'status',hidden:true});
var save=E('button',{class:'btn pri',onclick:async function(){if(busy)return;if(!pw.value){msg('Enter the password.');return}
  busy=true;save.disabled=true;msg('Saving…');t.name=nm.value.trim()||t.name;
  try{var r=await register(t,pw.value);
    if(r.ok){ST.tables.push(t);msg('');badge.hidden=false;badge.replaceChildren('✓ Registered: ',E('b',null,btxt(t)),' now opens ',t.name);save.hidden=true;pw.value='';
      badge.append(E('div',{class:'tools'},E('a',{class:'btn',href:'#'+key(t)},'Open table'),pdfBtn(t),xlsxBtn(t)))}
    else{msg(r.error);save.disabled=false}}
  catch(e){msg('Could not reach the server. Try again.');save.disabled=false}
  busy=false}},'Save');
var form=E('div',null,E('p',null,'Found '+t.reagents.length+' reagents ('+t.reagents.filter(function(r){return r.name!=='None'}).map(function(r){return r.name}).join(', ')+'). 96 wells.'),
  E('label',{class:'f'},E('span',{class:'lab'},'Table name'),nm),E('label',{class:'f'},E('span',{class:'lab'},'Password'),pw),save,badge);
if(p.neg.length){var w=E('div',{class:'warn'},E('p',null,'Heads up: some of these values are negative. Do you still want to proceed?'),E('p',{class:'hint'},'Cells: '+p.neg.slice(0,8).join(', ')+(p.neg.length>8?' …':'')),
  E('div',{class:'tools'},E('button',{class:'btn pri',onclick:function(){w.replaceWith(form)}},'Proceed'),E('button',{class:'btn',onclick:function(){f.value='';out.replaceChildren()}},'Re-upload')));out.append(w)}else out.append(form)
}).catch(function(e){msg(e.message||'Could not read that file.')})});
v.append(E('div',{class:'card'},E('p',null,'Choose a spreadsheet with a Plate tab. Concentrations and volumes are read from the tab as saved.'),f),out)}

window.addEventListener('hashchange',render);render();
